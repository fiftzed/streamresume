[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fiftzed-streamresume"
version = "0.1.0"
description = "沿流式记录标出中断点与恢复行为，标出产生重复或丢失的位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fiftzed" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://fiftzed.github.io"
Repository = "https://github.com/fiftzed/streamresume"
Issues = "https://github.com/fiftzed/streamresume/issues"

[project.scripts]
streamresume = "streamresume:main"

[tool.setuptools]
py-modules = ["streamresume"]
